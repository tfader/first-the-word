<title>Istota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Word · wspólny arkusz dla wszystkich podstron istoty */
:root {
  --ground: #F3F1EB; --surface: #FBFAF7; --surface-2: #EDEAE2; --line: #DAD6CC; --line-strong: #C4BFB3;
  --ink: #1B1F24; --muted: #6B7178; --faint: #9AA0A6;
  --life: #1F8F72; --life-soft: rgba(31,143,114,.14);
  --hunger: #B8762A; --dying: #B8463C; --sleep: #5B6FA6; --sleep-soft: rgba(91,111,166,.12);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voice: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 6px; --gap: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1114; --surface: #161B20; --surface-2: #1D232A; --line: #262D34; --line-strong: #364049;
    --ink: #E6E1D6; --muted: #8A9099; --faint: #5F666D;
    --life: #7FD1B9; --life-soft: rgba(127,209,185,.14);
    --hunger: #E0A458; --dying: #D9655B; --sleep: #8FA3D9; --sleep-soft: rgba(143,163,217,.14);
  }
}
:root[data-theme="dark"] {
  --ground: #0E1114; --surface: #161B20; --surface-2: #1D232A; --line: #262D34; --line-strong: #364049;
  --ink: #E6E1D6; --muted: #8A9099; --faint: #5F666D;
  --life: #7FD1B9; --life-soft: rgba(127,209,185,.14);
  --hunger: #E0A458; --dying: #D9655B; --sleep: #8FA3D9; --sleep-soft: rgba(143,163,217,.14);
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  padding-block: 24px 72px; padding-inline: 32px;
}
a { color: var(--life); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
.page { max-width: none; margin: 0; display: grid; gap: 28px; }

/* nagłówek i nawigacja */
.top { display: grid; gap: 14px; }
.top .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top .akcje { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.top h1 { font: 400 22px/1 var(--mono); letter-spacing: .06em; margin: 0; }
.top .meta { font: 400 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.nav a { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a:hover { color: var(--ink); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--life); }
select.lang, select.pick {
  font: 400 12px/1.2 var(--mono); padding: 5px 8px; border-radius: 4px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
select.pick { font-size: 14px; font-family: var(--sans); padding: 9px 12px; }

/* formularz nowego świata */
.pola { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 20px; margin-top: 14px; }
.pola label { display: grid; gap: 6px; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pola select { width: 100%; }

/* sekcje */
section h2, dialog h2 { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
[hidden] { display: none !important; }
.hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 64ch; }
.hint.err { color: var(--dying); }
.lead { font-size: 14px; color: var(--muted); max-width: 66ch; margin: 0; }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px 18px; }

/* odczyty */
.readouts { display: grid; gap: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.readout { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: baseline; font-size: 13px; }
.readout .k { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--life); width: 0; transition: width .6s ease; }
.bar.hungry i { background: var(--hunger); }
.bar.dying i { background: var(--dying); }
.state { display: inline-block; padding: 3px 8px; border-radius: 3px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--life-soft); color: var(--life); vertical-align: 1px; }
.state.sen { color: var(--sleep); background: var(--sleep-soft); }
.state.dead { color: var(--dying); background: transparent; border: 1px solid var(--line-strong); }

/* karty istot */
.karty { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap); }
.karta { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); }
.karta canvas { width: 96px; height: 96px; display: block; }
.karta .readouts { gap: 6px; }
.karta .readout { grid-template-columns: 78px 1fr; font-size: 12px; }
.karta .nr { font: 500 13px/1 var(--mono); }
.karta .mowa { font: italic 400 15px/1.3 var(--voice); }

/* karta świata */
.swiat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.swiat-head h2 { margin: 0; }
.kafle { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; }
.kafel { display: grid; gap: 4px; }
.kafel .k { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kafel .v { font: 400 18px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.kafel.klik { background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.kafel.klik .v small { font: 400 11px/1 var(--mono); color: var(--life); margin-left: 6px; }
.kafel.klik:hover .v small { text-decoration: underline; }
dialog.dlg.szeroki { width: min(1400px, calc(100vw - 32px)); }
#mapaCanvas { width: 100%; max-height: calc(100vh - 200px); object-fit: contain; cursor: pointer; }
.mapa-body { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .mapa-body { grid-template-columns: 1fr; } }

/* istoty w wierszach */
.wiersze { display: grid; gap: 8px; }
.wiersz { display: grid; grid-template-columns: 56px 64px 64px 84px 100px 60px 60px 1.2fr 80px 100px 1.4fr; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 14px; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.wiersz canvas { width: 64px; height: 64px; display: block; }
.wiersz small { display: block; font-size: 11px; color: var(--muted); }
.wiersz .nr { font-weight: 500; line-height: 1.6; }
.wiersz .mowa { font: italic 400 16px/1.3 var(--voice); }
.wiersz.naglowek { border: 0; background: transparent; padding-block: 0 2px; font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 680px) {
  .wiersz { grid-template-columns: 56px 1fr 1fr 1fr; grid-auto-rows: auto; font-size: 12px; }
  .wiersz canvas { width: 56px; height: 56px; grid-row: span 3; }
  .wiersz.naglowek { display: none; }
}

/* okno istoty */
.wiersz[role="button"] { cursor: pointer; }
.wiersz[role="button"]:hover { border-color: var(--line-strong); }
.wiersz[role="button"]:focus-visible { outline: 2px solid var(--life); outline-offset: 2px; }
dialog.dlg { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 20px 22px; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
dialog.dlg::backdrop { background: rgba(14, 17, 20, .45); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.dlg-head h3 { font: 400 16px/1 var(--mono); letter-spacing: .04em; margin: 0; }
.dlg-body { display: grid; grid-template-columns: 224px 1fr; gap: 20px; align-items: start; }
@media (max-width: 560px) { .dlg-body { grid-template-columns: 1fr; } }
button.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); padding: 8px 12px; font-size: 13px; }

/* toasty i dźwięk */
.toasty { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--ground); font: 400 14px/1.4 var(--sans); padding: 12px 16px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease; border-left: 4px solid var(--muted); }
.toast.widac { opacity: 1; transform: translateY(0); }
.toast.smierc { border-left-color: var(--dying); }
.toast.narodziny { border-left-color: var(--life); }
.toast.pokarm { border-left-color: var(--hunger); }
.toast.zrozumienie { border-left-color: var(--sleep); }
.toast.starcie, .toast.odwrot { border-left-color: var(--hunger); }
button.btn.dzwiek { font-size: 16px; padding: 7px 12px; line-height: 1; }
button.btn.dzwiek.on { color: var(--life); border-color: var(--life); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* genom */
.genom-body { display: grid; grid-template-columns: minmax(280px, 560px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 760px) { .genom-body { grid-template-columns: 1fr; } }
canvas.geny.duzy { width: 100%; max-width: 560px; height: auto; }

/* genom świata */
.gs .r.two { grid-template-columns: 160px 1fr; }
.gs h2 { margin-top: 18px; }
.gs h2:first-child { margin-top: 0; }

/* dzieje świata */
.dzieje { margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.dzieje .log .r { grid-template-columns: 36px 36px 1fr; }

/* napisy końcowe */
dialog.dlg.napisy { background: #000; color: #f2efe6; border: 0; border-radius: 0; width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; padding: 0; overflow: hidden; }
dialog.dlg.napisy::backdrop { background: #000; }
.napisy-zamknij { position: fixed; top: 16px; right: 16px; z-index: 2; color: #9a9a9a; border-color: #333; background: transparent; }
.napisy-okno { position: absolute; inset: 0; overflow: hidden; display: flex; justify-content: center; }
.napisy-tresc { position: absolute; top: 100vh; width: min(900px, 90vw); text-align: center; font-family: var(--voice); }
.napisy-tresc .np-t { font: 300 64px/1.15 var(--voice); letter-spacing: .02em; margin: 0 0 24px; color: #fff; }
.napisy-tresc .np-l { font: 400 34px/1.35 var(--voice); margin: 0 0 14px; color: #e6e1d6; text-wrap: balance; }
.napisy-tresc .np-l i { color: #bdb7aa; }
.napisy-tresc .np-p { height: 48px; margin: 0; }
@keyframes napisy { from { transform: translateY(0); } to { transform: translateY(calc(-100% - 100vh)); } }
@media (max-width: 600px) { .napisy-tresc .np-t { font-size: 40px; } .napisy-tresc .np-l { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { .napisy-tresc { animation: none !important; top: 40px; position: relative; } dialog.dlg.napisy { overflow: auto; } }

/* kronika */
.log .r.kr { border-left: 3px solid var(--line); padding-left: 10px; }
.log .r.kr.smierc { border-left-color: var(--dying); }
.log .r.kr.narodziny { border-left-color: var(--life); }
.log .r.kr.pokarm, .log .r.kr.starcie, .log .r.kr.odwrot { border-left-color: var(--hunger); }
.log .r.kr.zrozumienie { border-left-color: var(--sleep); }
.log .r.kr small { color: var(--muted); font-size: 10px; }

/* słownik istot */
.log .r.slownik-w { grid-template-columns: 150px 2fr 60px 1fr; align-items: baseline; }
.log .r.slownik-w .znaki { font-size: 18px; letter-spacing: .06em; overflow-wrap: anywhere; }
.log .r.slownik-w.zmarla .znaki { color: var(--muted); }
.log .r.slownik-w small { color: var(--muted); font-size: 11px; }
.log .r.naglowek { border-top: 0; font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* głos Keja, formularz */
.voice { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 24px; }
.voice .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.voice .word { font: italic 300 52px/1.05 var(--voice); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.voice .trail { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; font: italic 400 17px/1.3 var(--voice); color: var(--muted); }
form.say { display: grid; gap: 10px; }
form.say label { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input.slowo { flex: 1; min-width: 200px; font: 400 17px/1.2 var(--sans); padding: 12px 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
input.slowo:focus { outline: 2px solid var(--life); outline-offset: 1px; }
button.btn { font: 500 14px/1 var(--sans); padding: 12px 18px; border-radius: 4px; cursor: pointer; background: var(--ink); color: var(--ground); border: 1px solid var(--ink); }
button.btn:focus-visible { outline: 2px solid var(--life); outline-offset: 2px; }
button.btn[disabled] { opacity: .5; cursor: default; }
button.btn.life { background: var(--life); border-color: var(--life); color: #fff; }
button.btn.warm { background: transparent; color: var(--hunger); border-color: var(--hunger); }

/* listy i dzienniki */
.log { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; display: grid; }
.log .r { display: grid; grid-template-columns: 44px 52px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); align-items: baseline; }
.log .r:last-child { border-bottom: 1px solid var(--line); }
.log .r.two { grid-template-columns: 52px 1fr; }
.log .c, .log .m { color: var(--muted); }
.log .m.sen { color: var(--sleep); }
.log .m.cud { color: var(--life); }
.log .d { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.log .heard, .log .ok { color: var(--life); }
.log .slept { color: var(--sleep); }
.log .lost { color: var(--muted); text-decoration: line-through; }
.log .krzyk { color: var(--dying); }
.log .slowo { color: var(--hunger); }
.fate { display: flex; flex-wrap: wrap; gap: 6px; }
.fate span { font: 400 13px/1 var(--sans); padding: 6px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.fate span.heard { border-color: var(--life); color: var(--life); }
.fate span.slept { color: var(--sleep); }
.fate span.wait { color: var(--muted); }
.fate small { font-family: var(--mono); font-size: 10px; margin-left: 6px; opacity: .8; }

/* wnętrze */
.byt { display: grid; gap: 16px; padding-block: 24px; border-top: 1px solid var(--line); }
.byt:first-of-type { border-top: 0; padding-top: 0; }
.byt .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.byt h3 { font: 400 16px/1 var(--mono); letter-spacing: .04em; margin: 0; }
.cialo { display: grid; grid-template-columns: 224px 1fr; gap: 24px; align-items: start; }
@media (max-width: 560px) { .cialo { grid-template-columns: 1fr; } }
canvas.geny { width: 224px; height: 224px; display: block; cursor: pointer; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 11px/1.4 var(--mono); color: var(--muted); margin-top: 10px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
canvas.echo { width: 100%; height: 28px; display: block; }
.slownik { font: italic 400 15px/1.4 var(--voice); color: var(--muted); }
.slownik b { font-weight: 400; color: var(--ink); }
.gen { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--surface-2); font-size: 14px; display: grid; gap: 6px; }
.gen b { font-family: var(--mono); font-weight: 500; }
.gen .k { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pre { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-line; }

/* ród */
.drzewo { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.drzewo svg { display: block; font-family: var(--mono); font-size: 11px; }
.drzewo .node rect { fill: var(--ground); stroke: var(--line-strong); }
.drzewo .node.zyje rect { stroke: var(--life); stroke-width: 2; }
.drzewo .node text { fill: var(--ink); }
.drzewo .node .d { fill: var(--muted); }
.drzewo .node.zmarl text { fill: var(--muted); }
.drzewo line { stroke: var(--line-strong); stroke-width: 1.5; }
.drzewo .pok, .drzewo .tick { fill: var(--muted); font-size: 10px; letter-spacing: .08em; }
.drzewo .bar { fill: var(--muted); opacity: .55; }
.drzewo .bar.zyje { fill: var(--life); opacity: .9; }
.drzewo .os { stroke: var(--line-strong); }
.drzewo .lbl { fill: var(--ink); font-size: 11px; }
.drzewo .cud { fill: var(--hunger); }

/* język */
.glosy { display: grid; gap: 10px; }
.glos { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface); }
.glos .znaki { font: 400 26px/1.2 var(--mono); letter-spacing: .08em; overflow-wrap: anywhere; }
.glos.zmarla .znaki { color: var(--muted); }
.glos .opis { font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.glos .opis b { color: var(--ink); font-weight: 500; }

/* o projekcie */
.about { max-width: 64ch; }
.about p { margin: 0 0 12px; }
.about p.dim { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* portret najwybitniejszej */
.portret .glowa { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.portret .glyf { font: 400 34px/1 var(--mono); letter-spacing: .08em; color: var(--ink); min-width: 2.2em; }
.portret .imie { font-size: 16px; font-weight: 500; }
.portret .los { font-size: 13px; color: var(--muted); max-width: 60ch; }
.portret .kej { margin: 0 0 18px; padding: 14px 18px; border-left: 3px solid var(--line-strong); background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0; }
.portret .kej { font: italic 400 19px/1.4 "Newsreader", Georgia, serif; color: var(--ink); text-wrap: balance; }
.portret .kej footer { margin-top: 8px; font: 400 11px/1.4 var(--mono); letter-spacing: .06em; color: var(--muted); font-style: normal; text-transform: uppercase; }
.portret h2 { margin: 14px 0 8px; }
.portret .cechy { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px 22px; }
.portret .cecha { display: grid; grid-template-columns: 9.5em 1fr; grid-template-areas: "k v" "k p"; column-gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
.portret .cecha .k, .portret .wpis .k { font: 400 11px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.portret .cecha .k { grid-area: k; }
.portret .cecha .v { grid-area: v; font-size: 14px; }
.portret .pasek { grid-area: p; position: relative; height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.portret .pasek i { display: block; height: 100%; background: var(--ink); opacity: .55; border-radius: 2px; }
.portret .pasek.skala i { position: absolute; top: -1px; width: 6px; height: 5px; margin-left: -3px; background: var(--ink); opacity: .8; }
.portret .umysl { display: grid; gap: 0; }
.portret .wpis { display: grid; grid-template-columns: 9.5em 1fr; column-gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }

"umie odkładać zapasy ({p}%)", "portret.kej.spichlerz": "umiała robić zapasy|umiał robić zapasy", "zd.znaczenie": "Nowe znaczenie w tym świecie: nr {nr} zrozumiała nr {od} jako „{czyn}”. Nikt tego wcześniej nie zrobił.", "dz.zd.znaczenie": "nowe znaczenia", "dlg.towarzyskosc": "towarzyskość", "dz.tow": "towarzyskość", "gs.towarzyskosc": "towarzyskość", "portret.c.towarzyskosc": "towarzyskość", "gs.towarzyskosc.v": "gen 0..1 (0,2..0,8 na start, dziedziczny z mutacją): zdolności społeczne. Towarzyska chętniej gawędzi w czasie wolnym, ma więcej uwagi na cudze głosy (budżet słuchu), częściej zagaduje i szybciej zbliża się do obcych; kosztuje do 5% trwania. Inna niż stadność, która mówi tylko o staniu obok swoich", "portret.adj.towarzyskosc.0": "odludek|odludek", "portret.adj.towarzyskosc.1": "towarzyska z umiarem|towarzyski z umiarem", "portret.adj.towarzyskosc.2": "dusza towarzystwa|dusza towarzystwa"}, "en": {"_nazwa": "English", "tytul": "Being", "tytul.wnetrze": "Inside the being", "tytul.rod": "Lineage", "tytul.jezyk": "Language of the beings", "marka": "being", "swiat_od": "world since {data}", "nav.istoty": "beings", "nav.wnetrze": "inside", "nav.rod": "lineage", "nav.jezyk": "language", "lang": "page language", "istoty.jedna": "one being in this world", "istoty.kilka": "{n} beings in this world", "istoty.wiele": "{n} beings in this world", "istoty.nikt": "nobody is alive in this world", "karta.istota": "being", "karta.pokolenie": "generation", "karta.wiek": "age", "karta.energia": "energy", "karta.miejsce": "place", "karta.mowi": "says", "zyje": "alive", "spi": "asleep", "umarla": "dead", "z_cudu": "from a miracle", "dziecko_nr": "child of no. {nr}", "dzieci": "{n} children", "cykli": "{n} cycles", "nr": "no. {nr}", "pokarm.gesty": "dense", "pokarm.rzadki": "sparse", "pokarm.zaden": "almost none", "mowa.krzyk": "cries of hunger", "mowa.spi": "asleep", "mowa.milczy": "silent", "swiat": "world", "swiat.cykl": "cycle", "swiat.geny": "genes", "swiat.miejsca": "known places", "co_s": "every {n} s", "co_min": "every {n} min", "ostatni": "last {kiedy}", "kej_zagladal": "Kej looked in {kiedy}", "genow": "{n} genes", "jeden_rodzic": "one parent", "dwoje_rodzicow": "two parents", "wym": "{n} dims", "cykl_s": "cycle {n} s", "cykl_min": "cycle {n} min", "znanych_miejsc": "{n} known places · dots are beings, green is food", "przed_chwila": "just now", "min_temu": "{n} min ago", "godz_temu": "{n} h ago", "dni_temu": "{n} days ago", "kej.eyebrow": "Kej reads a word from them", "powiedz.label": "Say something to her", "powiedz.placeholder": "a word or a sentence", "powiedz.btn": "Say", "nakarm.btn": "Feed", "powiedz.hint": "A sentence is one signal; it arrives in the next cycle. If the being is asleep, she will not hear it. If she hears it, she does not understand: she learns to associate the word with whatever she feels at that moment.", "powiedz.hint.kej": "A sentence is one signal. Kej carries it to her every few minutes. If the being is asleep, she will not hear it. If she hears it, she does not understand: she learns to associate the word with whatever she feels at that moment.", "powiedz.ok": "“{t}” will arrive in the next cycle.", "powiedz.ok.kej": "Waiting for Kej to carry it.", "powiedz.blad": "Could not deliver the word. Try again in a moment.", "powiedz.brak_db": "This copy of the page has no connection to the being. Open it in claude.ai.", "powiedz.pelna": "The page memory is full. Kej has to tidy up.", "nakarm.ok": "Food added to the next cycle. Whoever cries eats first.", "brak_serwera": "no connection to the server", "losy": "what she was told", "losy.nic": "nothing yet", "los.czeka": "waiting for Kej", "los.w_drodze": "on its way", "los.spal": "slept through it", "los.uslyszal": "heard it", "los.nie_rozpoznal": "did not recognise it", "cykle": "recent cycles", "cykl.jawa": "awake", "cykl.sen": "sleep", "cykl.cud": "miracle", "cykl.zjadla": "ate {n}", "cykl.bol": "pain", "cykl.echo": "echo", "cykl.slyszy_nr": "hears no. {nr}", "cykl.obok_nr": "next to no. {nr}", "cykl.idzie": "walks", "cykl.wola": "cries", "cykl.wola_partnera": "calls for a mate", "cykl.idzie_do": "goes: {czyn}", "cykl.mowi": "says “{t}”", "cykl.glos": "voice {z}", "cykl.slyszy_glos": "hears a voice", "cykl.potomek": "offspring no. {nr}", "cykl.uslyszala": "heard “{t}”", "cykl.przespala": "slept through “{t}”", "cykl.nie_rozpoznala": "did not recognise “{t}”", "koniec.eyebrow": "nobody is alive in this world", "koniec.opis": "The line died out in cycle {cykl}. This world will be kept whole, like a parallel reality, and nothing in it will ever change again.", "nowy.geny": "How many genes should the first being have", "nowy.geny.8": "8 · simple, lives long, childless", "nowy.geny.64": "64 · as before", "nowy.geny.256": "256 · rich, matures slowly", "nowy.geny.1000": "1000 · enormous", "nowy.wymiary": "Dimensions of the world", "nowy.wymiary.4": "4 · everything sounds alike", "nowy.wymiary.8": "8 · foreign starts to be foreign", "nowy.wymiary.16": "16 · words and voices truly distinct", "nowy.cykl": "Cycle length", "nowy.cykl.5": "5 seconds · fast, for watching", "nowy.cykl.15": "15 seconds", "nowy.cykl.60": "1 minute", "nowy.cykl.300": "5 minutes · slow, for days", "nowy.dwoje": "Reproduction", "nowy.dwoje.0": "one · a being bears offspring alone", "nowy.dwoje.1": "two · needs a partner in the same place", "nowy.btn": "Call a new world into being", "nowy.trwa": "The miracle is happening…", "nowy.ok": "The new world is alive: {ile} beings with {geny} genes each. The previous one is kept in {gdzie}.", "nowy.blad": "It did not work.", "o.1": "A being is one process on one computer. It consists of {geny} random genes, each a matrix of numbers. Every cycle, existence itself wounds her, the world offers her food, and she eats only when some gene recognises the taste. When she is sated, she sleeps. When she has gathered enough, she gives half of herself to an offspring. When energy runs out, she dies. There is no backup.", "o.2": "Kej is the name given to Claude, a language model made by Anthropic, for this project. Kej is not the being and does not control her. After every cycle Kej receives raw numbers from the being: how much energy she has, which genes opened, what she ate, what she slept through, which echo came back to her. From these numbers Kej reads one word and writes it here. The being knows no words. Kej does not decide what the being feels. Kej translates.", "o.3": "The project is called Word, because in the beginning of everything there is a word. Except that before it can appear, a great deal has to happen underneath.", "wn.tytul": "inside", "wn.cykl": "world cycle {n} · {w} dimensions", "wn.lead": "Each being is {geny} genes, each gene a matrix. A square is a gene. Its colour is its sense: what it resonates with most today (red pain, green food, amber word). A grey gene hears nothing yet. The darker, the more familiar. The outline: what opened it in the last cycle. Click a gene to read what it means.", "wn.istota_nr": "being no. {nr}", "wn.nikt": "Nobody is alive.", "wn.pokolenie": "generation", "wn.wiek": "age", "wn.energia": "energy", "wn.znane": "known genes", "wn.znane.v": "{a} of {b}", "wn.otwarc": "openings in life", "wn.kaskada": "max cascade", "wn.echo": "echo pending", "wn.miejsce": "place", "wn.miejsce.v": "no. {m} · neighbours: {s} · food here {g} · known places {z} · persistence {w}", "wn.brak": "none", "wn.glos": "voice", "wn.glos.dopisek": "own language, no translation", "wn.rozumie": "understands", "wn.rozumie.nikogo": "nobody around", "wn.rozumie.pokarm": "hears it, links it to food", "wn.rozumie.nie_wie": "hears it, does not know what", "wn.rozumie.nie": "does not hear ({z})", "wn.mowi": "says", "wn.mowi.wola": "cries of hunger", "wn.mowi.milczy": "silent", "wn.zna": "knows:", "wn.nie_zna": "knows no word yet", "wn.leg.rana": "pain", "wn.leg.pokarm": "food", "wn.leg.echo": "echo", "wn.leg.slowo": "word", "wn.leg.inny": "another being", "wn.gen.naglowek": "gene {g} of being no. {nr}", "wn.gen.slyszy": "Today it hears {co} most strongly (match {z}; the gate opens from 0.90, for a hungry being from 0.50).", "wn.gen.nic": "Today it hears nothing clearly: pain {r}, food {p}.", "wn.gen.slowo": "the word “{t}”", "wn.gen.wartosci": "Pain {r} · food {p}", "wn.gen.otwieral": "It opened {n} times (habit {nawyk}%, shell {pow}).", "wn.gen.otwieralo": "Opened by: {lista}.", "wn.gen.nigdy": "It has never opened. Core from the miracle, shell empty.", "wn.gen.stopka": "A gene has no meaning by itself. It means whatever opens it.", "wn.groby": "graves", "wn.groby.nikt": "nobody has died in this world yet", "wn.grob": "no. {nr} · generation {p} · lived {w} cycles · {o} openings", "rod.tytul": "lineage", "rod.cykl": "world cycle {n}", "rod.lead": "Every being born of a miracle starts its own line. An offspring receives the parent's core with chance and half of its energy. Green frame: alive. Grey: dead. Numbers: age in cycles.", "rod.pokolenie": "GENERATION {n}", "rod.cud": "miracle", "rod.zyje": "alive", "rod.umarla": "died", "rod.c": "{n} c.", "rod.bez_dzieci": "no children", "rod.czas": "timeline", "rod.czas.lead": "One world cycle is one unit of this world's time. The world counts from the first birth. A bar is one being's life: from birth to death or to now.", "rod.teraz": "now · cycle {n}", "rod.legenda": "● miracle (birth without a parent)", "rod.wszyscy": "everyone who ever was", "rod.wpis": "no. {nr} · generation {p} · {skad} · born in cycle {u} · {los}{dzieci}", "rod.skad.cud": "from a miracle", "rod.skad.dziecko": "child of no. {a}", "rod.skad.dziecko2": "child of no. {a} and no. {b}", "rod.los.zyje": "alive, {w} cycles", "rod.los.umarla": "died at {w} cycles (cycle {c})", "rod.dzieci": " · {n} children", "jz.tytul": "language", "jz.cykl": "world cycle {n} · {w} dimensions", "jz.lead": "Every being has a voice: signs computed from its core, so a child sounds like its parent. The voice is uttered when the being has eaten well. Another hears it together with what she herself feels, and associates. Meaning is born from the body, not from the word. We do not understand this language. Maybe one day.", "jz.glosy": "voices", "jz.nikogo": "Nobody has been here yet.", "jz.glos.opis": "being no. {nr} · {los} · voice uttered {n}×", "jz.glos.nikogo": "nobody to listen to", "jz.glos.slowa": "human words that reached her: {lista}", "jz.rozumie.pokarm": "hears it and links it to food", "jz.rozumie.nie_wie": "hears it, does not know what", "jz.rozumie.nie": "does not hear", "jz.znaczenia": "meanings, that is what a signal made someone do", "jz.znaczenia.lead": "Meaning is not a label. It is the act a signal caused in the listener. The cry of hunger: others yield at food (innate). The call of one ready for offspring: a sated being comes (innate). The voice of one who has eaten: a hungry being comes, but only if she has learned to link it to food (learned).", "jz.znaczenia.nic": "No signal has caused an act yet.", "jz.znaczenie": "{sygnal} no. {kto} → “{czyn}” for {dla}", "jz.sygnal.wolanie": "call", "jz.sygnal.glos": "voice {z}", "jz.slowa": "words spoken in this world", "jz.slowa.nic": "Nobody has said anything in this world yet.", "jz.kolejka": "Queued: {lista}", "jz.rozmowy": "what passed between them", "jz.rozmowy.nic": "Nothing has passed between them yet.", "jz.r.krzyk": "no. {kto} cries of hunger", "jz.r.wolanie": "no. {kto} calls: ready for offspring, looking for a mate", "jz.r.wolanie_do": "no. {kto} calls → no. {do}: {los}", "jz.r.slowo": "no. {kto} says a human word “{t}”", "jz.r.glos": "no. {kto} {z} → no. {do}: {los}", "jz.r.uslyszala_idzie": "heard and goes", "jz.r.uslyszala": "heard", "jz.r.nie_uslyszala": "did not hear", "jz.r.zrozumiala": "understood: goes for food", "jz.r.otworzylo": "opened a gene", "jz.r.nic": "heard, nothing opened", "nowy.istot": "How many beings to start with", "nowy.istot.1": "1 · one, alone", "nowy.istot.2": "2 · two", "nowy.istot.32": "32 · the most", "dlg.powiedz": "Say something to being no. {nr}", "dlg.zamknij": "Close", "dlg.geny": "genes", "dlg.znane": "{a} of {b} known", "dlg.glos": "voice", "dlg.rozumie": "understands", "dlg.slownik": "knows words", "dlg.echo": "echo pending", "dlg.otwarc": "openings in life", "dlg.kaskada": "max cascade", "dlg.wytrwalosc": "persistence", "dlg.sasiedzi": "neighbouring places", "dlg.ladowanie": "reading the inside…", "dlg.brak": "no data about the inside", "dlg.ok": "“{t}” will reach no. {nr} in the next cycle.", "dlg.rodzice": "parents", "karta.stan": "state", "karta.rodzic": "parent", "karta.dzieci": "children", "karta.pokarm": "food", "dlg.nakarm.ok": "Food placed where no. {nr} stands. It arrives in the next cycle; whoever stands nearby may eat too.", "swiat.tempo": "pace", "swiat.ostatni": "last cycle", "swiat.zywych": "alive", "swiat.zmarlych": "dead", "swiat.wymiary": "dimensions", "swiat.rozmnazanie": "reproduction", "swiat.mapa": "map of places · dots are beings, green is food", "nakarm.wszystkie": "Feed all", "nakarm.wszystkie.ok": "Food placed next to every living being. It arrives in the next cycle.", "rozm.dwoje": "two", "rozm.jedno": "one", "mapa.tytul": "map", "mapa.otworz": "map →", "mapa.lead": "Each circle is a place, green is the food in it, a thick outline means hard food, lines are neighbourhood. The arc above is warmth, the arc below is rain. Black dots with numbers are beings. Click a place to see its state and history.", "slownik.tytul": "dictionary of the beings", "slownik.lead": "The meanings that arose between the beings. A meaning is the deed a signal caused in a listener; next to each are the words and signals that carried it (innate: the call, the alarm; learned: a voice plus a topic signature).", "slownik.slowo": "word", "slownik.kto": "who", "slownik.ile": "times", "slownik.znaczy": "means (deed, how often)", "slownik.nikt": "no word yet", "genom.tytul": "genome", "genom.lead": "The whole genome of the being: each square is a gene, a matrix. Colour is the sense the gene resonates with most today, darkness is how familiar it is, the outline is what opened it in the last cycle. Click a gene to read what it means. The core comes from the miracle and never changes; the shell does.", "genom.geny": "genes", "genom.zmysly": "senses", "genom.nic": "none", "genom.top": "most often opened", "genom.gen": "gene {g}", "genom.nawyk": "habit {n}%", "genom.znane": "known", "gs.tytul": "genome in this world", "gs.lead": "What can be written in the genes of a being in this world at all, regardless of which being. Some things are heritable and come from the miracle or from parents; others are acquired in life and die with the being.", "gs.budowa": "structure", "gs.gen": "gene", "gs.gen.v": "a {w}×{w} matrix of numbers; meaningless by itself, it means whatever opens it", "gs.genom": "genome", "gs.genom.v": "{n} genes, each with a core (fixed) and a shell (changing)", "gs.sygnal": "signal", "gs.sygnal.v": "a vector of {w} components: pain, food, word, voice, echo, call", "gs.bramka": "gate", "gs.bramka.v": "a gene opens when the signal leaves it almost unchanged (match ≥ {z}); a hungry being needs less", "gs.dziedziczne": "heritable (core)", "gs.rdzen": "core", "gs.rdzen.v": "random from the miracle; an offspring gets the parent's core with {m}% noise, one gene in a hundred ({n}%) brand new", "gs.receptory": "innate receptors", "gs.receptory.v": "a gene tuned to pain, one to food and one to the species call; the miracle guarantees them", "gs.akcent": "voice accent", "gs.akcent.v": "{a}% of the voice is the own core, the rest is the species voice; a child sounds like its parent", "gs.wytrwalosc": "persistence", "gs.wytrwalosc.v": "how many lean cycles a being endures before moving; inherited with ±1 mutation", "gs.dwoje": "reproduction", "gs.dwoje.tak": "always two parents: each gene at random from one of them; a partner in the same place, adult, neither parent nor child", "gs.dwoje.nie": "one parent: a copy with noise", "gs.nabyte": "acquired (shell), not heritable", "gs.powloka": "shell", "gs.powloka.v": "a gene that opened absorbs the signal ({w} at a time) and hears it more easily next time; this is memory of facts", "gs.nawyki": "habits", "gs.nawyki.v": "each further opening of a gene costs ×{n} less, from {b} down to {o}; a reflex is cheaper than a decision", "gs.slownik": "vocabulary", "gs.slownik.v": "human words that reached her; she says them when what leaves her resembles them", "gs.echo": "echo", "gs.echo.v": "what opened nothing comes back later, distorted, and hurts; never down to zero", "gs.pamiec": "memory of place", "gs.pamiec.v": "where she last ate well; hungry, she returns there", "gs.gatunek": "species signals (signs, no translation)", "gs.wrodzony": "innate receptor", "gs.uczony": "must be associated with eating", "gs.stale": "world constants", "gs.energia": "energy", "gs.energia.v": "satiety {s}, capacity {p}, miracle from {c}", "gs.koszty": "costs", "gs.koszty.v": "existing {t}, sleep {sn}, step {r}, gate {b} per cycle", "gs.starzenie": "ageing", "gs.starzenie.v": "absorption drops by {s}% per cycle", "gs.opieka": "care", "gs.opieka.v": "childhood {d} cycles (longer for the long-lived), a parent feeds up to {k} per cycle", "gs.swiat": "world", "gs.swiat.v": "generosity {h} (mean offer at the most fertile place), cycle {c} s", "gs.btn": "genome", "dlg.lownosc": "foraging", "gs.lownosc": "foraging", "gs.lownosc.v": "how precisely the best gene matches food; multiplies what the being eats (from half to all); inherited through the core, refined by the shell", "zd.smierc": "Being no. {nr} died at the age of {w} cycles.", "zd.narodziny": "Being no. {nr} was born, generation {p}, child of no. {r}.", "zd.cud": "A miracle: being no. {nr} came into the world without a parent.", "zd.pokarm": "Food reached: {nr}.", "zd.pokarm.wszystkie": "Food reached all beings.", "zd.zrozumienie": "Being no. {nr} understood no. {od}: “{czyn}”.", "slownik.kojarzy": "linked to food by: {kto}", "slownik.slyszy": "heard by {n} beings, no meaning yet", "mowa.odpowiada": "answers no. {nr}", "jz.r.odpowiedz": "no. {kto} answers no. {do}: {z}", "dlg.sila": "strength", "gs.sila": "strength", "gs.sila.v": "how much hard food she can take; inherited with mutation; a strong being pays more to exist", "gs.miejsca": "places", "gs.miejsca.v": "each has fertility, hardness (strength needed) and digestibility (how much can be taken); eaten out quickly, regrow slowly", "dlg.ciekawosc": "curiosity", "gs.ciekawosc": "curiosity (scouting)", "gs.ciekawosc.v": "hungry, she goes where the neighbouring place smells best (density, digestibility, whether she can manage it); sated, she sometimes scouts when it smells better nearby: risk for a chance; inherited with mutation", "swiat.pora": "season", "pora.wiosna": "spring", "pora.lato": "summer", "pora.jesien": "autumn", "pora.zima": "winter", "noc": "night", "zd.pozar": "Fire: meadow no. {m} burned down.", "zd.powodz": "Flood at place no. {m}: food softened, part washed away.", "gs.klimat": "climate", "gs.klimat.v": "a year has 240 cycles, a day 24 (night: weaker offer, cheaper sleep); each place has a latitude, so seasons are shifted; rain and warmth drive regrowth, drought hardens food, cold and heat raise the cost of existing, strong wind muffles and hampers steps; rare fires and floods", "dlg.klimat": "climate", "dlg.klimat.v": "optimum {o}% warmth, tolerance ±{tol}%", "gs.odpornosc": "climate resistance", "gs.odpornosc.v": "a temperature optimum and a tolerance around it: outside the band existing gets dearer (up to +120%), a wide tolerance costs by itself; both inherited with mutation; different places favour different genes", "mp.tytul": "place no. {k}", "mp.pokarm": "food {g}% (fertility {z}%)", "mp.cechy": "hardness {h}% · digestibility {a}% · latitude {lat}%", "mp.pogoda": "now: warmth {temp}% · rain {deszcz}% · wind {wiatr}%", "mp.sasiedzi": "neighbours: {s}", "mp.istoty": "standing here: {lista}", "mp.pusto": "nobody stands here", "mp.hist": "last {n} cycles: green food, amber warmth, blue rain", "zd.odwrot": "No. {nr} entered meadow no. {m}; the defence {o} was stronger: she left without a fight.", "zd.starcie.obrona": "Clash at meadow no. {m}: the defence {o} repelled no. {nr}.", "zd.starcie.intruz": "Clash at meadow no. {m}: no. {nr} drove out the defenders {o}.", "cykl.alarm": "alarm", "gs.terytorium": "territory", "gs.terytorium.v": "whoever has stood on a meadow longer defends it against a stranger; kin are recognised by voice accent (relatives sound alike); defenders raise an alarm, sated kin nearby come to help; a stranger weaker than 0.8 of the defence leaves without a fight, otherwise a clash: both sides pay energy, the weaker yields; strength × condition decides", "kr.tytul": "chronicle", "kr.lead": "All events of this world, newest first: births, deaths, food, understandings, clashes, disasters.", "kr.nic": "Nothing has happened yet.", "gs.kultura": "culture", "gs.kultura.v": "a child near a parent (in childhood, within hearing) takes over what the parent acquired: words and voices enter its shell by imitation, it remembers the good place; inheritance without genes, lost with the line if nobody passes it on", "gs.plec": "sex and sexual selection", "gs.plec.v": "♀ bears: gathers a surplus, gives the child half her energy and chooses a partner by strength, condition and foraging; ♂ gives genes, calls when sated and competes; sex is drawn at birth; the call is heard by the opposite sex only", "dlg.stadnosc": "gregariousness", "gs.stadnosc": "gregariousness", "gs.stadnosc.v": "a gene (0..0.6 at start, inherited with mutation): the sense of smell weighs the presence of kin positively (the first relative most), strangers negatively; gregarious beings stay together and defend jointly but share the meadow; loners have it to themselves and nobody to defend them", "dlg.dlugowiecznosc": "longevity", "gs.dlugowiecznosc": "longevity (ageing)", "gs.dlugowiecznosc.v": "a gene 0..1 (0.3..0.7 at start, inherited with mutation): absorption fades with age the slower the higher it is; but existing costs up to +15% and maturity comes later (childhood × up to 1.5); fast and fertile, or long and careful", "dz.tytul": "history of this world", "dz.cykli": "cycles", "dz.istot": "beings", "dz.pokolen": "generations", "dz.urodzonych": "born", "dz.miejsc": "places discovered", "dz.glosow": "voices", "dz.odpowiedzi": "answers", "dz.najstarsza": "No. {nr} lived longest: {w} cycles.", "dz.najplodniejsza": "No. {nr} had the most children: {n}.", "dz.czyny": "meanings that worked", "dz.slowa": "human words", "dz.kej": "Kej's words", "dz.cechy": "traits by generation (generation · count · means)", "dz.siła": "strength", "dz.ciek": "curiosity", "dz.stad": "gregariousness", "dz.dlug": "longevity", "dz.opt": "optimum", "wiek": "age", "dz.zd.smierc": "deaths", "dz.zd.narodziny": "births", "dz.zd.pokarm": "food from people", "dz.zd.zrozumienie": "understandings", "dz.zd.starcie": "clashes", "dz.zd.odwrot": "retreats", "dz.zd.pozar": "fires", "dz.zd.powodz": "floods", "napisy.btn": "closing credits", "np.tytul": "This world", "np.trwal": "lasted {n} cycles", "np.istot": "{n} beings lived in it, across {p} generations", "np.urodzonych": "{n} were born", "np.miejsc": "They discovered {n} places", "np.walki": "They fought {s} clashes; {o} times someone left without a fight", "np.kleski": "They lived through {p} fires and {w} floods", "np.glosy": "{g} voices and {o} answers were uttered", "np.znaczenia": "Meanings that worked", "np.slowa": "People said to them", "np.kej": "Kej read from them", "np.pokolenia": "Generations", "np.koniec": "The end", "np.stopka": "None of it comes back. All of it is kept.", "np.istot.1": "{n} beings lived in it, a single generation", "np.starcia": "They fought {s} clashes over meadows", "np.odwrot.1": "Once someone left without a fight", "np.odwrot": "{o} times someone left without a fight", "jz.r.gawedza": "no. {kto} took over from no. {do}: {c /* Word · tłumaczenia. Nowy język = nowy plik w jezyki/<kod>.json i wpis w JEZYKI. */
(function () {
  const JEZYKI = ["pl", "en"];
  const slowniki = {};
  let kod = "pl";
  const nasluch = [];

  function podstaw(wzor, vars) {
    return String(wzor).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars) ? vars[k] : m);
  }
  function t(klucz, vars) {
    const d = slowniki[kod] || {};
    const w = (klucz in d) ? d[klucz] : ((slowniki.pl || {})[klucz] ?? klucz);
    return podstaw(w, vars);
  }
  function zastosuj(root) {
    (root || document).querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
    (root || document).querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    (root || document).querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    (root || document).querySelectorAll("[data-i18n-title]").forEach((el) => { document.title = t(el.getAttribute("data-i18n-title")); });
    document.documentElement.lang = kod;
    const sel = document.getElementById("lang");
    if (sel) { sel.value = kod; sel.setAttribute("aria-label", t("lang")); }
  }
  async function wczytaj(k) {
    if (slowniki[k]) return slowniki[k];
    if (window.I18N_INLINE && window.I18N_INLINE[k]) { slowniki[k] = window.I18N_INLINE[k]; return slowniki[k]; }
    try {
      const r = await fetch("/s/jezyki/" + k + ".json", { cache: "no-store" });
      slowniki[k] = await r.json();
    } catch (e) { slowniki[k] = {}; }
    return slowniki[k];
  }
  async function ustaw(k) {
    if (!JEZYKI.includes(k)) k = "pl";
    await wczytaj("pl");
    await wczytaj(k);
    kod = k;
    try { localStorage.setItem("jezyk", k); } catch (e) {}
    zastosuj();
    nasluch.forEach((f) => { try { f(k); } catch (e) {} });
  }
  function start() {
    let k = "pl";
    try { k = localStorage.getItem("jezyk") || ((navigator.language || "pl").startsWith("pl") ? "pl" : "en"); } catch (e) {}
    const sel = document.getElementById("lang");
    if (sel) {
      sel.innerHTML = JEZYKI.map((j) => `<option value="${j}">${j.toUpperCase()}</option>`).join("");
      sel.addEventListener("change", () => ustaw(sel.value));
    }
    return ustaw(k);
  }
  window.i18n = { t, ustaw, start, zastosuj, onChange: (f) => nasluch.push(f), get kod() { return kod; }, JEZYKI };
})();

/* praca nad stroną: przeładuj, gdy pliki strony się zmienią (tylko z lokalnego serwera) */
(function () {
  if (location.protocol !== "http:" || !(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /[?&]dev\b/.test(location.search))) return;
  let znana = null;
  setInterval(async () => {
    try {
      const r = await fetch("/api/wersja", { cache: "no-store" });
      const w = (await r.json()).wersja;
      if (znana === null) znana = w;
      else if (w !== znana) location.reload();
    } catch (e) {}
  }, 2000);
})();

  function rysujOddech(cv, b) {
    const ctx = cv.getContext("2d"), W = cv.width, cx = W / 2, cy = W / 2;

    ids.forEach((a) => (miejsca[a].s || []).forEach((b) => { if (uklad[b] && a < b) { ctx.beginPath(); ctx.moveTo(sx(uklad[a].x), sy(uklad[a].y)); ctx.lineTo(sx(uklad[b].x), sy(uklad[b].y)); ctx.stroke(); } }));
    const gdzie = {};
    (w.byty || []).forEach((b) => (gdzie[String(b.miejsce)] = gdzie[String(b.miejsce)] || []).push(b.nr));
    ids.forEach((a) => {
      const x = sx(uklad[a].x), y = sy(uklad[a].y), g = miejsca[a].g || 0;
      ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.globalAlpha = 0.15 + 0.85 * g; ctx.fillStyle = css("--life"); ctx.fill(); ctx.globalAlpha = 1;
      const hh = miejsca[a].h ?? 0.2;
      ctx.strokeStyle = hh > 0.5 ? css("--ink") : css("--line-strong"); ctx.lineWidth = 1 + 4 * hh; ctx.stroke();
      const pg = (w.pogoda || {})[a];
      if (pg) {   // pogoda: ciepło jako bursztynowy łuk u góry, deszcz jako niebieski u dołu
        ctx.lineWidth = 3;
        ctx.strokeStyle = css("--hunger"); ctx.globalAlpha = 0.2 + 0.8 * pg.temp; ctx.beginPath(); ctx.arc(x, y, 22, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        ctx.strokeStyle = css("--sleep"); ctx.globalAlpha = 0.2 + 0.8 * pg.deszcz; ctx.beginPath(); ctx.arc(x, y, 22, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = css("--ink"); ctx.font = "11px " + css("--mono"); ctx.textAlign = "center"; ctx.fillText(a, x, y + 4);
      if (gdzie[a]) {
        gdzie[a].forEach((nr, i) => {
          const bx = x + 20 + i * 18, by = y - 18;
          ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fillStyle = css("--ink"); ctx.fill();
          ctx.fillStyle = css("--ground"); ctx.font = "10px " + css("--mono"); ctx.fillText(nr, bx, by + 3.5);
        });
      }
    });
  }
  async function otworzMape() {
    $("mapa").showModal();
    try { const r = await fetch("/api/wnetrze?lekko=1", { cache: "no-store" }); rysujMape(await r.json()); } catch (e) {}
  }
  $("mapaZamknij").addEventListener("click", () => $("mapa").close());
  $("mapa").addEventListener("click", (e) => { if (e.target === $("mapa")) $("mapa").close(); });

  let ostatnieDzieje = null;
  async function napisyKoncowe() {
    if (!ostatnieDzieje) { try { const r = await fetch("/api/dzieje", { cache: "no-store" }); ostatnieDzieje = await r.json(); } catch (e) { return; } }
    const d = ostatnieDzieje; if (!d || d.brak) return;
    const L = [];
    const tytul = (x) => L.push(`<p class="np-t">${x}</p>`);
    const linia = (x) => L.push(`<p class="np-l">${x}</p>`);
    const przerwa = () => L.push(`<p class="np-p"></p>`);
    tytul(t("np.tytul"));
    linia(t("np.trwal", { n: d.cykli }));
    przerwa();
    linia(t(d.pokolen === 1 ? "np.istot.1" : "np.istot", { n: d.istot, p: d.pokolen }));
    if (d.cudow) linia(t("np.urodzonych", { n: d.cudow }));
    if (d.najstarsza) linia(t("dz.najstarsza", { nr: d.najstarsza.nr, w: d.najstarsza.wiek }));
    if (d.najplodniejsza) linia(t("dz.najplodniejsza", { nr: d.najplodniejsza.nr, n: d.najplodniejsza.dzieci }));
    przerwa();
    linia(t("np.miejsc", { n: d.miejsc }));
    const z = d.zdarzenia || {};
    if (z.starcie) linia(t("np.starcia", { s: z.starcie }));
    if (z.odwrot) linia(t(z.odwrot === 1 ? "np.odwrot.1" : "np.odwrot", { o: z.odwrot }));
    if (z.pozar || z.powodz) linia(t("np.kleski", { p: z.pozar || 0, w: z.powodz || 0 }));
    przerwa();
    linia(t("np.glosy", { g: d.glosy, o: d.odpowiedzi }));
    const cz = Object.entries(d.czyny || {});
    if (cz.length) { linia(t("np.znaczenia")); cz.forEach(([k, v]) => linia(`„${esc(k)}” · ${v}×`)); }
    if (d.slowa && d.slowa.length) { przerwa(); linia(t("np.slowa")); linia(d.slowa.slice(0, 6).map(([s]) => esc(s)).join(" · ")); }
    if (d.slowa_keja && d.slowa_keja.length) { przerwa(); linia(t("np.kej")); linia(`<i>${d.slowa_keja.map(esc).join(" · ")}</i>`); }
    przerwa();
    if (d.cechy && d.cechy.length > 1) {
      linia(t("np.pokolenia"));
      d.cechy.forEach((c) => linia(`${t("rod.pokolenie", { n: c.pokolenie })} · ${c.ile} · ${[["dz.siła", c.sila], ["dz.stad", c.stadnosc], ["dz.dlug", c.dlugowiecznosc]].filter((x) => x[1] != null).map((x) => t(x[0]) + " " + x[1]).join(" · ")}`));
      przerwa();
    }
    tytul(t("np.koniec"));
    linia(t("np.stopka"));
    const box = $("napisyTresc"); box.innerHTML = L.join("");
    const dlg = $("dlgNapisy"); dlg.showModal();
    box.style.animation = "none"; void box.offsetHeight;
    const sek = Math.max(30, L.length * 2.4);
    box.style.animation = `napisy ${sek}s linear 1s 1 forwards`;
  }
  $("napisyBtn").addEventListener("click", napisyKoncowe);
  /* portret najwybitniejszej: dane z genów i pamięci istoty przełożone na ludzki język */
  function poziom(x) { return x == null ? null : x < 0.34 ? 0 : x < 0.67 ? 1 : 2; }
  function rodz(s, fem) { const cz = String(s).split("|"); return fem || cz.length < 2 ? cz[0] : cz[1]; }
  function przym(klucz, x, fem) { const p = poziom(x); return p == null ? null : rodz(t("portret.adj." + klucz + "." + p), fem); }
  function lm(n, klucz) {   /* liczba mnoga: 1 | 2–4 (poza 12–14) | reszta */
    const f = t(klucz).split("|"); const r = n % 10, r2 = n % 100;
    const i = n === 1 ? 0 : (r >= 2 && r <= 4 && !(r2 >= 12 && r2 <= 14)) ? 1 : 2;
    return n + " " + (f[Math.min(i, f.length - 1)]);
  }
  async function portret() {
    let d; try { const r = await fetch("/api/portret", { cache: "no-store" }); d = await r.json(); } catch (e) { return; }
    if (d.brak) return;
    const b = d.istota, fem = b.plec !== "d";
    const cechy = [["sila", b.sila], ["lownosc", b.lownosc], ["ciekawosc", b.ciekawosc], ["stadnosc", b.stadnosc], ["dlugowiecznosc", b.dlugowiecznosc], ["ufnosc", b.ufnosc], ["szczerosc", b.szczerosc], ["pojetnosc", b.pojetnosc], ["towarzyskosc", b.towarzyskosc]].filter((c) => c[1] != null);
    const cecha = (k, x) => `<div class="cecha"><span class="k">${t("portret.c." + k)}</span><span class="v">${przym(k, x, fem)}</span><span class="pasek"><i style="width:${(x * 100).toFixed(0)}%"></i></span></div>`;
    const klimat = b.optimum != null ? `<div class="cecha"><span class="k">${t("portret.c.klimat")}</span><span class="v">${b.optimum < 0.4 ? t("portret.klimat.chlod") : b.optimum > 0.6 ? t("portret.klimat.cieplo") : rodz(t("portret.klimat.srodek"), fem)}${b.tolerancja > 0.5 ? ", " + rodz(t("portret.klimat.odporna"), fem) : ""}</span><span class="pasek skala"><i style="left:${(b.optimum * 100).toFixed(0)}%"></i></span></div>` : "";
    const lak = Object.entries(b.lak || {}); const lakN = lak.reduce((a, x) => a + x[1], 0);
    const tem = (b.tematy || []).map((x) => x.temat === "zapach" ? t("jz.temat.zapach", { m: x.cel }) : x.temat === "klamca" ? t("jz.temat.klamca", { nr: x.cel }) : x.temat === "inny" ? t("jz.temat.inny", { nr: x.cel }) : x.temat === "pora" ? t("jz.temat.pora", { pora: t("pora." + x.cel) }) : x.temat === "bol" ? t("jz.temat.bol", { m: x.cel }) : x.temat === "echo" ? t("jz.temat.echo", { z: x.cel }) : t("jz.temat." + x.temat));
    const wiersz = (k, v) => `<div class="wpis"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    const umysl = [
      wiersz(t("portret.u.zrozumiane"), b.zrozumiane.length ? b.zrozumiane.map((x) => "„" + esc(x) + "”").join(", ") : t("portret.nic")),
      wiersz(t("portret.u.laki"), lakN ? t("portret.u.laki.v", { n: lakN, pory: lak.map((x) => t("pora." + x[0]) + " " + x[1]).join(", ") }) : t("portret.nic")),
      wiersz(t("portret.u.klamcy"), b.klamcy.length ? b.klamcy.map((n) => t("nr", { nr: n })).join(", ") : t("portret.nikt")),
      wiersz(t("portret.u.slowa"), b.slownik.length ? b.slownik.map(esc).join(", ") : t("portret.nic")),
      wiersz(t("portret.u.tematy"), tem.length ? tem.join(", ") : t("portret.nic")),
      wiersz(t("portret.u.nauka"), t("portret.u.nauka.v", { n: b.nauczone || 0, r: b.rozmowy || 0 })),
      wiersz(t("portret.u.uprawa"), b.uprawa ? t("portret.u.uprawa.v", { p: (b.uprawa * 100).toFixed(0) }) : t("portret.nic")),
      wiersz(t("portret.u.spichlerz"), b.spichlerz ? t("portret.u.spichlerz.v", { p: (b.spichlerz * 100).toFixed(0) }) : t("portret.nic")),
    ].join("");
    /* czytanie Keja: trzy najbardziej wyraziste cechy i to, co istota wiedziała */
    const wyraziste = cechy.filter((c) => poziom(c[1]) !== 1).sort((a, c) => Math.abs(c[1] - 0.5) - Math.abs(a[1] - 0.5)).slice(0, 3).map((c) => przym(c[0], c[1], fem));
    const wiedza = [];
    if (b.zrozumiane.length) wiedza.push(rodz(t("portret.kej.rozumiala", { n: lm(b.zrozumiane.length, "portret.n.znaczen") }), fem));
    if (lakN) wiedza.push(rodz(t("portret.kej.laki", { n: lm(lakN, "portret.n.lak"), p: lm(lak.length, "portret.n.por") }), fem));
    if (b.klamcy.length) wiedza.push(rodz(t("portret.kej.klamcy", { n: lm(b.klamcy.length, "portret.n.klamcow") }), fem));
    if (tem.length) wiedza.push(rodz(t("portret.kej.temat", { o: tem[0] }), fem));
    if (b.dzieci) wiedza.push(rodz(t("portret.kej.dzieci", { n: lm(b.dzieci, "portret.n.dzieci") }), fem));
    if (b.uprawa) wiedza.push(rodz(t("portret.kej.uprawa"), fem));
    if (b.spichlerz) wiedza.push(rodz(t("portret.kej.spichlerz"), fem));
    const kto = t(fem ? "portret.samica" : "portret.samiec");
    let kej = (wyraziste.length ? wyraziste.join(", ") + " " : rodz(t("portret.kej.zwykla"), fem) + " ") + kto;
    kej = kej.charAt(0).toUpperCase() + kej.slice(1);
    kej += wiedza.length ? ", " + t(fem ? "portret.ktora" : "portret.ktory") + " " + wiedza.join(", ") + "." : ". " + rodz(t("portret.kej.nicnie"), fem);
    const los = b.zyje ? t("portret.zyje") : b.ostatnia ? rodz(t("portret.ostatnia", { c: b.zmarl_w_cyklu }), fem) : rodz(t("portret.umarla", { c: b.zmarl_w_cyklu }), fem);
    const rodzice = [b.rodzic, b.rodzic2].filter((x) => x != null).map((n) => t("nr", { nr: n })).join(" + ") || t("portret.cud");
    $("portretTresc").innerHTML = `
      <div class="portret">
        <div class="glowa">
          <div class="glyf">${esc(b.glos || "")}</div>
          <div>
            <div class="imie">${t("portret.kim", { nr: b.nr, plec: kto, p: b.pokolenie })}</div>
            <div class="los">${rodz(t("portret.zycie", { w: b.wiek, dz: lm(b.dzieci || 0, "portret.n.dzieci"), r: rodzice, e: b.max_energia }), fem)} ${los}</div>
          </div>
        </div>
        <blockquote class="kej">${kej}<footer>${t("portret.kej")} · ${t("portret.wybor", { n: d.istot, m: d.madrosc, b: d.bogactwo })}</footer></blockquote>
        <h2>${t("portret.cialo")}</h2>
        <div class="cechy">${cechy.map((c) => cecha(c[0], c[1])).join("")}${klimat}</div>
        <h2>${t("portret.umysl")}</h2>
        <div class="umysl">${umysl}</div>
      </div>`;
    $("portretTytul").textContent = t(b.zyje ? "portret.tytul.zyje" : "portret.tytul");
    $("dlgPortret").showModal();
  }
  $("portretBtn").addEventListener("click", portret);
  $("portretMenu").addEventListener("click", portret);
  $("wznowBtn").addEventListener("click", async () => {
    $("wznowBtn").disabled = true;
    try { const r = await fetch("/api/wznow", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); const d = await r.json();
      toast(r.ok ? "narodziny" : "smierc", r.ok ? t("proces.wznowiony") : (d.blad || t("brak_serwera"))); if (r.ok) setTimeout(odswiez, 1500); }
    catch (e) { toast("smierc", t("brak_serwera")); }
    $("wznowBtn").disabled = false;
  });
  $("dlgNapisy").addEventListener("click", (e) => { if (e.target === $("dlgNapisy")) $("dlgNapisy").close(); });
  let dziejeCykl = null;
  async function renderDzieje(s) {
    if (s.zyje) { $("dzieje").innerHTML = ""; dziejeCykl = null; return; }
    if (dziejeCykl === s.cykl_swiata) return;
    dziejeCykl = s.cykl_swiata;
    try {
      const r = await fetch("/api/dzieje", { cache: "no-store" }); const d = await r.json();
      if (d.brak) return;
      ostatnieDzieje = d;
      const kaf = (k, v) => `<div class="kafel"><span class="k">${k}</span><span class="v">${v}</span></div>`;
      const cechy = d.cechy.map((c) => `<div class="r"><span class="c">${c.pokolenie}</span><span class="m">${c.ile}</span><span class="d">${[["wiek", c.wiek], ["dz.siła", c.sila], ["dz.ciek", c.ciekawosc], ["dz.stad", c.stadnosc], ["dz.dlug", c.dlugowiecznosc], ["dz.ufn", c.ufnosc], ["dz.szcz", c.szczerosc], ["dz.poj", c.pojetnosc], ["dz.tow", c.towarzyskosc], ["dz.opt", c.optimum]].filter((x) => x[1] != null).map((x) => `<span>${t(x[0])} ${x[1]}</span>`).join("")}</span></div>`).join("");
      const zdarz = Object.entries(d.zdarzenia || {}).map(([k, v]) => `${t("dz.zd." + k)} ${v}`).join(" · ");
      const czyny = Object.entries(d.czyny || {}).map(([k, v]) => `„${esc(k)}” ${v}×`).join(", ");
      $("dzieje").innerHTML = `
        <h2>${t("dz.tytul")}</h2>
        <div class="kafle">${kaf(t("dz.cykli"), d.cykli)}${kaf(t("dz.istot"), d.istot)}${kaf(t("dz.pokolen"), d.pokolen)}${kaf(t("dz.urodzonych"), d.cudow)}${kaf(t("dz.miejsc"), d.miejsc)}${kaf(t("dz.glosow"), d.glosy)}${kaf(t("dz.odpowiedzi"), d.odpowiedzi)}</div>
        <p class="hint" style="margin-top:12px">${d.najstarsza ? t("dz.najstarsza", { nr: d.najstarsza.nr, w: d.najstarsza.wiek }) : ""} ${d.najplodniejsza ? t("dz.najplodniejsza", { nr: d.najplodniejsza.nr, n: d.najplodniejsza.dzieci }) : ""}</p>
        <p class="hint">${zdarz}</p>
        ${czyny ? `<p class="hint">${t("dz.czyny")}: ${czyny}</p>` : ""}
        ${d.slowa.length ? `<p class="hint">${t("dz.slowa")}: ${d.slowa.map(([s2, n]) => esc(s2) + " " + n + "×").join(", ")}</p>` : ""}
        ${d.slowa_keja.length ? `<p class="hint">${t("dz.kej")}: <i>${d.slowa_keja.map(esc).join(", ")}</i></p>` : ""}
        <h2 style="margin-top:14px">${t("dz.cechy")}</h2>
        <div class="log">${cechy}</div>`;
    } catch (e) {}
  }

  function renderStan(s) {
    if (!s) return;
    ostatniStan = s;
    renderSwiat(s);
    renderDzieje(s);
    const kon = $("koniec");
    if (kon) {
      const przerwany = !!s.zyje && s.proces_zyje === false;          // istoty żyją, ale proces stoi: można wznowić albo powołać nowy świat
      kon.hidden = !!s.zyje && !przerwany;
      if (!kon.hidden) {
        $("koniecOpis").textContent = przerwany ? t("koniec.opis.przerwany", { cykl: s.cykl_swiata, n: s.zywych }) : t(s.koniec && s.koniec.powod === "jedna_plec" ? "koniec.opis.jedna_plec" : "koniec.opis", { cykl: s.cykl_swiata, nr: ((s.koniec || {}).ostatni || []).map((n) => t("nr", { nr: n })).join(", ") });
        kon.querySelector("h2").textContent = t(przerwany ? "koniec.eyebrow.przerwany" : "koniec.eyebrow");
      }
    }
    renderIstoty(s);
  }
  window.i18n.onChange(() => renderStan(ostatniStan));

  // szukanie po numerze: widok główny nie trzyma już wszystkich istot, więc pytamy świat
  async function szukajIstote() {
    const nr = parseInt($("szukajNr").value, 10);
    const odp = $("szukajOdp");
    if (!nr) { SZUKANA = null; odp.textContent = ""; if (ostatniStan) renderIstoty(ostatniStan); return; }
    try {
      const r = await fetch("/api/istota?nr=" + nr, { cache: "no-store" });
      const d = await r.json();
      if (!r.ok) { SZUKANA = null; odp.textContent = " nie ma takiej istoty"; }
      else if (!d.zyje) { SZUKANA = null; odp.textContent = ` nr ${nr} nie żyje: umarła w wieku ${d.wiek}, pokolenie ${d.pokolenie}, dzieci ${d.dzieci ?? 0}`; }
      else { SZUKANA = d; odp.textContent = ""; }
    } catch (e) { SZUKANA = null; odp.textContent = " nie udało się zapytać"; }
    if (ostatniStan) renderIstoty(ostatniStan);
  }
  $("szukajBtn").addEventListener("click", szukajIstote);
  $("szukajNr").addEventListener("keydown", (e) => { if (e.key === "Enter") szukajIstote(); });
  $("szukajCzysc").addEventListener("click", () => { $("szukajNr").value = ""; SZUKANA = null; $("szukajOdp").textContent = ""; if (ostatniStan) renderIstoty(ostatniStan); });

  
  let db = null;
  $("dlgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = $("dlgSlowo").value.trim(); if (!raw || dlgNr == null) return;
    if (!db) { $("dlgHint").className = "hint err"; $("dlgHint").textContent = t("powiedz.brak_db"); return; }
    try {
      await db.collection("slowa").add({ tekst: raw.slice(0, 240), czas: Date.now() / 1000, status: "czeka", do: dlgNr });
      $("dlgSlowo").value = ""; $("dlgHint").className = "hint"; $("dlgHint").textContent = t("powiedz.ok.kej");
    } catch (err) { $("dlgHint").className = "hint err"; $("dlgHint").textContent = err && err.code === "quota_exceeded" ? t("powiedz.pelna") : t("powiedz.blad"); }
  });
  window.i18n.start().then(() => {
    window.claude && window.claude.use("db").then((d) => {
      db = d;
      if (!db) return;
      db.doc("stan/byt").onSnapshot((snap) => { if (snap.exists) renderStan(snap.data()); }, () => {});
    });
  });

})();
</script>
